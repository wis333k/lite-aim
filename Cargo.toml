[workspace]

[package]
name = "aimcoach"
version = "0.3.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "3d",
    "ui",
    "ui_picking",
    "2d",
    "audio",
    "wav",
    "vorbis",
    "bevy_gltf",
    "gltf_animation",
    "bevy_gizmos",
    "bevy_log",
    "default_font",
    "multi_threaded",
    "png",
    "jpeg",
    "hdr",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
