<script>
"use strict";
/* =========================================================================
   BẮM NHỮNG NGÔI SAO — game web trẻ em
   1 file HTML tự chứa · 0 asset ngoài · 6 bản đồ · 7 mèo · 10 nâng cấp

/* =================== LƯU & ĐỌC =================== */
var SAVE_KEY='bnn_save_v3';
var S = { coins:0, cats:['gold'], ups:{}, map:'garden', maps:['garden'],
          total:0, best:0, plays:0, streak:0, lastDay:'', lastSeen:0, muted:false };
function load(){
  try{ var raw=localStorage.getItem(SAVE_KEY); if(raw){ var d=JSON.parse(raw);
    for(var k in S) if(d[k]!==undefined) S[k]=d[k]; } }catch(e){}
  if(!S.cats||!S.cats.length) S.cats=['gold'];
  if(!S.maps||!S.maps.length) S.maps=['garden'];
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function money(n){ n=Math.floor(n); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function today(){ return new Date().toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* =================== DỮ LIỆU =================== */
var MAPS=[
  { id:'garden', name:'Vườn Mây', cost:0, coin:1.00, groundH:56,
    sky:['#d6f0ff','#8fd3f4'], sun:'#ffe58f', far:'#a8ddb0', mid:'#7ec98a', ground:'#8ed36a', top:100, note:'Nơi bắt đầu' },
  { id:'beach', name:'Bãi Biển', cost:600, coin:1.10, groundH:64,
    sky:['#bdeaff','#ffe7b8'], sun:'#fff3b0', far:'#7fd4e8', mid:'#4fb8d0', ground:'#f5deb3', top:100, note:'+10% xu' },
  { id:'forest', name:'Rừng Mưa', cost:2500, coin:1.20, groundH:70,
    sky:['#cfeec2','#7fb069'], sun:'#d9f99d', far:'#6aa84f', mid:'#4e7a34', ground:'#6b9e42', top:96, note:'+20% xu' },
  { id:'night', name:'Đêm Đầy Sao', cost:9000, coin:1.35, groundH:58,
    sky:['#28306b','#0b1035'], sun:'#fdf6c8', far:'#2f3a72', mid:'#232a58', ground:'#3a4373', top:96, note:'+35% xu · khó hơn' },
  { id:'snow', name:'Núi Tuyết', cost:22000, coin:1.50, groundH:72,
    sky:['#eaf6ff','#b8d8f0'], sun:'#ffffff', far:'#c9dff0', mid:'#a8c4dc', ground:'#f2f8fd', top:96, note:'+50% xu' },
  { id:'space', name:'Vũ Trụ', cost:65000, coin:2.00, groundH:54,
    sky:['#2b1055','#12052b'], sun:'#ffd6f5', far:'#3d1f6e', mid:'#2a1550', ground:'#43276e', top:92, note:'×2 xu · huyền thoại' }
];
function MAP(id){ for(var i=0;i<MAPS.length;i++) if(MAPS[i].id===id) return MAPS[i]; return MAPS[0]; }

var UPS=[
  { id:'tap',   name:'Tay Khỏe',   desc:'+2 điểm mỗi lần bấm',           base:60,   grow:1.55, max:60 },
  { id:'coin',  name:'Ví Tiền',     desc:'+10% xu mỗi ván',              base:100,  grow:1.60, max:30 },
  { id:'time',  name:'Đồng Hồ',     desc:'+2 giây mỗi ván',               base:140,  grow:1.72, max:15 },
  { id:'luck',  name:'May Mắn',     desc:'+2% cơ hội gặp sao vàng',       base:260,  grow:1.75, max:20 },
  { id:'combo', name:'Chuỗi Mạnh',  desc:'+1 điểm ở mỗi bậc chuỗi',      base:200,  grow:1.66, max:30 },
  { id:'crit',  name:'Huyền Thoại', desc:'+3% cơ hội bấm 3 lần điểm',    base:380,  grow:1.80, max:20 },
  { id:'life',  name:'Thêm Mạng',   desc:'+1 tim mạng',                    base:500,  grow:2.30, max:4  },
  { id:'auto',  name:'Chim Hay',     desc:'Chim tự bấm nhanh hơn',         base:750,  grow:2.00, max:12 },
  { id:'x2',    name:'Gấp Đôi',     desc:'+25% xu nhận được',             base:950,  grow:1.90, max:24 },
  { id:'frenzy',name:'Cuồng Nộ',     desc:'Chuỗi 10 mở Frenzy: điểm ×3, 5 giây', base:1400, grow:2.10, max:6 }
];
function UP(id){ for(var i=0;i<UPS.length;i++) if(UPS[i].id===id) return UPS[i]; return null; }
function upLv(id){ return S.ups[id]||0; }
function upCost(id){ var u=UP(id); return Math.floor(u.base*Math.pow(u.grow,upLv(id))); }

var CATS=[
  { id:'gold',   name:'Mèo Vàng',     col:'#ffd43b', cost:0,     coin:1, pts:1, time:0, life:0, desc:'Người bạn đầu tiên' },
  { id:'pink',   name:'Mèo Hồng',     col:'#ffa8c5', cost:350,   coin:1.15, pts:1, time:0, life:0, desc:'+15% xu' },
  { id:'blue',   name:'Mèo Xanh',     col:'#74c0fc', cost:1100,  coin:1, pts:1, time:5, life:0, desc:'+5 giây mỗi ván' },
  { id:'purple', name:'Mèo Tím',      col:'#b197fc', cost:3000,  coin:1, pts:1.20, time:0, life:0, desc:'+20% điểm' },
  { id:'orange', name:'Mèo Cam',      col:'#ffa94d', cost:7500,  coin:1, pts:1, time:0, life:1, desc:'+1 mạng' },
  { id:'silver', name:'Mèo Bạc',      col:'#adb5bd', cost:18000, coin:1.10, pts:1.10, time:0, life:0, desc:'+10% xu · +10% điểm' },
  { id:'rainbow',name:'Mèo Cầu Vồng', col:'#f06595', cost:55000, coin:1.30, pts:1.20, time:3, life:1, desc:'+30% xu · +3s · +1 mạng' }
];
function CAT(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return CATS[0]; }
function owned(id){ return S.cats.indexOf(id)>=0; }
function bonus(){ var b={coin:1,pts:1,time:0,life:0};
  for(var i=0;i<S.cats.length;i++){ var c=CAT(S.cats[i]); b.coin*=c.coin; b.pts*=c.pts; b.time+=c.time; b.life+=c.life; }
  return b; }

/* =================== ÂM THANH =================== */
var AC=null;
function ac(){ if(AC) return AC; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } return AC; }
function tone(f,dur,type,vol,slide,delay){
  var a=ac(); if(!a||S.muted) return;
  if(a.state==='suspended') a.resume();
  var t0=a.currentTime+(delay||0);
  var o=a.createOscillator(), gn=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur);
  gn.gain.setValueAtTime(0.0001,t0);
  gn.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+dur+0.03);
}
var SFX={
  hit:function(c){ tone(700+(c||0)*45,0.10,'triangle',0.18,380); },
  gold:function(){ [0,1,2].forEach(function(i){ tone(880+i*330,0.16,'sine',0.20,300,i*0.05); }); },
  combo:function(n){ [0,1,2,3].forEach(function(i){ tone(523*(1+0.26*i)+(n||0)*30,0.14,'square',0.13,200,i*0.055); }); },
  miss:function(){ tone(170,0.13,'sawtooth',0.09,-55); },
  buy:function(){ tone(523,0.10,'sine',0.20); tone(784,0.14,'sine',0.20,null,0.09); tone(1046,0.18,'sine',0.18,null,0.18); },
  deny:function(){ tone(200,0.10,'square',0.10); tone(150,0.14,'square',0.09,null,0.09); },
  start:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.13,'sine',0.18,null,i*0.07); }); },
  over:function(){ [523,440,349,262].forEach(function(f,i){ tone(f,0.30,'triangle',0.18,null,i*0.14); }); },
  levelup:function(){ [659,784,988,1318].forEach(function(f,i){ tone(f,0.20,'sine',0.20,null,i*0.09); }); },
  frenzy:function(){ [392,523,659,784,1046].forEach(function(f,i){ tone(f,0.18,'square',0.15,null,i*0.06); }); },
  coin:function(){ tone(1200,0.07,'square',0.07,null,0); tone(1600,0.09,'square',0.06,null,0.06); }
};

/* =================== CANVAS =================== */
var cv=document.getElementById('c'), g=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* =================== TIỆN ÍCH VẼ =================== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function txt(s,x,y,size,col,align,weight,stroke){
  g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif';
  g.textAlign=align||'center'; g.textBaseline='middle';
  if(stroke){ g.lineWidth=Math.max(3,size*0.16); g.lineJoin='round';
    g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=col; g.fillText(s,x,y);
}
function fitTxt(s,x,y,maxW,size,col,align,weight,stroke){
  g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif';
  var w=g.measureText(s).width;
  if(w>maxW){ size=Math.max(10,Math.floor(size*(maxW/w))); g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif'; }
  g.textAlign=align||'center'; g.textBaseline='middle';
  if(stroke){ g.lineWidth=Math.max(3,size*0.16); g.lineJoin='round';
    g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=col; g.fillText(s,x,y);
}
function panel(x,y,w,h,r,a){ g.fillStyle='rgba(255,255,255,'+(a===undefined?0.94:a)+')'; rr(x,y,w,h,r); g.fill(); }
function btn(x,y,w,h,label,size,fill,active){
  g.save();
  if(!active) g.translate(0,3);
  g.fillStyle='rgba(0,0,0,.16)'; rr(x,y,w,h,Math.min(18,h/2)); g.fill();
  g.fillStyle=fill; rr(x,y,w,h,Math.min(18,h/2)); g.fill();
  g.restore();
  txt(label,x+w/2,y+h/2+1,size,'#fff','center');
}
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* =================== HẠT / HIỆU ỨNG =================== */
var bits=[], pops=[], conf=[], shake=0, flash=0, flashCol='#fff';
function burst(x,y,col,n,spd){
  for(var i=0;i<n;i++){ if(bits.length>340) break;
    var a=rnd(0,6.2832), s=rnd(1,spd||6);
    bits.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,6),rot:rnd(0,6),vr:rnd(-9,9)});
  }
}
function popAt(x,y,t,col,size){ if(pops.length>24) pops.shift();
  pops.push({x:x,y:y,t:t,life:1,col:col,size:size||24}); }
function confetti(n,col){
  for(var i=0;i<n;i++){ if(conf.length>160) break;
    conf.push({x:rnd(0,W),y:rnd(-60,-5),vx:rnd(-40,40),vy:rnd(70,220),life:1,
      col:col||pick(['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#b197fc','#ff922b']),
      w:rnd(5,11),h:rnd(8,15),rot:rnd(0,6.28),vr:rnd(-7,7)});
  }
}
function doShake(amt){ shake=Math.min(22,shake+amt); }
function doFlash(col,amt){ flashCol=col; flash=Math.min(1,flash+amt); }
function clearFx(){ bits=[]; conf=[]; pops=[]; shake=0; flash=0; }
function goto(newSt){ clearFx(); st=newSt; }

/* =================== VẼ MÈO =================== */
function catArt(x,y,s,col,tilt,face){
  g.save(); g.translate(x,y); if(tilt) g.rotate(tilt);
  g.strokeStyle='rgba(40,30,60,.30)'; g.lineWidth=Math.max(2,s*0.075); g.lineJoin='round';
  g.fillStyle=col; g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-s*0.75,-s*0.55); g.lineTo(-s*0.35,-s*1.18); g.lineTo(-s*0.14,-s*0.60); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo( s*0.75,-s*0.55); g.lineTo( s*0.35,-s*1.18); g.lineTo( s*0.14,-s*0.60); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='rgba(0,0,0,.08)'; g.beginPath(); g.arc(0,s*0.38,s*0.44,0,6.2832); g.fill();
  g.restore();
  if(face) faceAt(x,y,s);
}
function faceAt(x,y,s){
  g.save(); g.translate(x,y);
  var ex=s*0.25, ey=-s*0.08, er=s*0.14;
  g.fillStyle='#fff'; g.beginPath(); g.arc(-ex,ey,er,0,6.2832); g.fill();
  g.beginPath(); g.arc(ex,ey,er,0,6.2832); g.fill();
  g.fillStyle='#333'; g.beginPath(); g.arc(-ex+er*0.12,ey+er*0.10,er*0.56,0,6.2832); g.fill();
  g.beginPath(); g.arc(ex+er*0.12,ey+er*0.10,er*0.56,0,6.2832); g.fill();
  g.fillStyle='rgba(255,120,150,.45)';
  g.beginPath(); g.arc(-s*0.47,s*0.14,s*0.16,0,6.2832); g.fill();
  g.beginPath(); g.arc(s*0.47,s*0.14,s*0.16,0,6.2832); g.fill();
  g.strokeStyle='#333'; g.lineWidth=Math.max(2,s*0.07); g.lineCap='round';
  g.beginPath(); g.arc(0,s*0.06,s*0.20,0.30,Math.PI-0.30); g.stroke();
  g.restore();
}

/* =================== NỀN THEO BẢN ĐỒ =================== */
var scroll=0, amb=[];
function initAmb(m){ amb=[]; for(var i=0;i<14;i++) amb.push({x:rnd(0,W),s:rnd(0.5,1.3),p:rnd(0,6.28)}); }
function cloud(x,y,s,a){
  g.save(); g.globalAlpha=(a===undefined?1:a); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#fff';
  g.beginPath(); g.arc(0,0,22,0,6.2832); g.arc(24,7,17,0,6.2832);
  g.arc(-24,8,16,0,6.2832); g.arc(6,-13,20,0,6.2832); g.fill(); g.restore();
}
function tree(x,y,s,col,col2){
  g.fillStyle='#7a5230'; g.fillRect(x-s*0.07,y-s*0.5,s*0.14,s*0.55);
  g.fillStyle=col; g.beginPath(); g.arc(x,y-s*0.62,s*0.42,0,6.2832); g.fill();
  g.beginPath(); g.arc(x-s*0.28,y-s*0.42,s*0.30,0,6.2832); g.fill();
  g.beginPath(); g.arc(x+s*0.28,y-s*0.42,s*0.30,0,6.2832); g.fill();
  g.fillStyle=col2; g.beginPath(); g.arc(x-s*0.12,y-s*0.74,s*0.20,0,6.2832); g.fill();
}
function palm(x,y,s){
  g.strokeStyle='#8a5a2b'; g.lineWidth=s*0.11; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+s*0.14,y-s*0.45,x+s*0.04,y-s*0.9); g.stroke();
  g.fillStyle='#3fa34d';
  for(var i=0;i<5;i++){ g.save(); g.translate(x+s*0.04,y-s*0.9); g.rotate(-Math.PI+i*0.62);
    g.beginPath(); g.ellipse(s*0.30,0,s*0.34,s*0.11,0,0,6.2832); g.fill(); g.restore(); }
}
function pine(x,y,s,col){
  g.fillStyle='#6b4a2b'; g.fillRect(x-s*0.08,y-s*0.28,s*0.16,s*0.32);
  g.fillStyle=col;
  for(var i=0;i<3;i++){ var yy=y-s*0.25-i*s*0.26, ww=s*(0.44-i*0.10);
    g.beginPath(); g.moveTo(x,yy-s*0.42); g.lineTo(x-ww,yy); g.lineTo(x+ww,yy); g.closePath(); g.fill(); }
}
function flower(x,y,s,c){
  g.strokeStyle='#4e7a34'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-s*0.9); g.stroke();
  g.fillStyle=c;
  for(var i=0;i<5;i++){ var a=i*1.2566;
    g.beginPath(); g.arc(x+Math.cos(a)*s*0.26,y-s*0.9+Math.sin(a)*s*0.26,s*0.18,0,6.2832); g.fill(); }
  g.fillStyle='#ffd43b'; g.beginPath(); g.arc(x,y-s*0.9,s*0.16,0,6.2832); g.fill();
}
function rock(x,y,s,c){
  g.fillStyle=c; g.beginPath();
  g.moveTo(x-s,y); g.lineTo(x-s*0.55,y-s*0.7); g.lineTo(x+s*0.2,y-s*0.9);
  g.lineTo(x+s*0.75,y-s*0.5); g.lineTo(x+s,y); g.closePath(); g.fill();
}
function planet(x,y,s,c,ring){
  g.save(); g.translate(x,y);
  if(ring){ g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=s*0.14;
    g.beginPath(); g.ellipse(0,0,s*1.6,s*0.42,-0.35,0,6.2832); g.stroke(); }
  g.fillStyle=c; g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill();
  g.fillStyle='rgba(0,0,0,.14)'; g.beginPath(); g.arc(s*0.3,s*0.2,s*0.7,0,6.2832); g.fill();
  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.arc(-s*0.3,-s*0.3,s*0.32,0,6.2832); g.fill();
  g.restore();
}
function drawBG(m,t){
  var grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,m.sky[0]); grd.addColorStop(1,m.sky[1]);
  g.fillStyle=grd; g.fillRect(-30,-30,W+60,H+60);
  var gy=H-m.groundH, i2, px, c;

  if(m.id==='space'){
    g.fillStyle='rgba(255,255,255,.9)';
    for(var i=0;i<70;i++){ var sx=((i*167+31)%997)/997*W, sy=((i*89+17)%601)/601*gy;
      g.globalAlpha=(0.35+0.65*Math.abs(Math.sin(t/700+i)))*0.9; g.fillRect(sx,sy,2,2); }
    g.globalAlpha=1;
    planet(W*0.16,gy*0.30,34,'#ff922b',true);
    planet(W*0.80,gy*0.18,20,'#74c0fc',false);
    planet(W*0.52,gy*0.62,13,'#f783ac',false);
  } else if(m.id==='night'){
    g.fillStyle='#fdf6c8'; g.beginPath(); g.arc(W*0.78,gy*0.22,30,0,6.2832); g.fill();
    g.fillStyle=m.sky[1]; g.beginPath(); g.arc(W*0.72,gy*0.17,27,0,6.2832); g.fill();
    g.fillStyle='rgba(255,255,255,.95)';
    for(var i=0;i<60;i++){ var sx=((i*211+13)%991)/991*W, sy=((i*103+7)%593)/593*gy;
      g.globalAlpha=0.3+0.7*Math.abs(Math.sin(t/900+i*1.7)); g.fillRect(sx,sy,2,2); }
    g.globalAlpha=1;
  } else {
    g.fillStyle=m.sun; g.globalAlpha=0.55;
    g.beginPath(); g.arc(W*0.84,gy*0.16,34,0,6.2832); g.fill(); g.globalAlpha=1;
    for(c=0;c<5;c++) cloud(((c*340+scroll*(0.10+c*0.02)+t*0.004)%(W+260))-130,
                           40+((c*73)%130),0.85+c*0.14,0.85);
  }

  g.fillStyle=m.far; g.beginPath(); g.moveTo(0,gy);
  for(var x=0;x<=W;x+=26) g.lineTo(x,gy-34-Math.sin((x+scroll*0.18)*0.006)*18-Math.sin((x*0.017)+1.2)*11);
  g.lineTo(W,gy); g.closePath(); g.fill();

    g.fillStyle=col; g.beginPath();
    for(var i=0;i<10;i++){ var a=-1.5708+i*0.6283, q=(i%2?s*0.46:s);

    g.fillStyle='rgba(255,255,255,.32)'; g.beginPath(); g.ellipse(-s*0.26,-s*0.16,s*0.30,s*0.15,0,0,6.2832); g.fill();
  } else if(t.kind==='balloon'){
    g.fillStyle=col; g.beginPath(); g.ellipse(0,0,s*0.70,s*0.82,0,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(0,s*0.79); g.lineTo(-s*0.13,s*0.95); g.lineTo(s*0.13,s*0.95); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-s*0.23,-s*0.28,s*0.15,s*0.22,-0.5,0,6.2832); g.fill();
  } else if(t.kind==='butterfly'){
    g.fillStyle=col;
    g.beginPath(); g.ellipse(-s*0.40,-s*0.24,s*0.48,s*0.38,-0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(s*0.40,-s*0.24,s*0.48,s*0.38,0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(-s*0.32,s*0.38,s*0.36,s*0.30,0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(s*0.32,s*0.38,s*0.36,s*0.30,-0.5,0,6.2832); g.fill(); g.stroke();
    g.fillStyle='#5a3d2b'; g.beginPath(); g.ellipse(0,0,s*0.10,s*0.42,0,0,6.2832); g.fill();
    g.beginPath(); g.arc(0,-s*0.42,s*0.12,0,6.2832); g.fill();
    g.strokeStyle='#5a3d2b'; g.lineWidth=Math.max(1.2,s*0.04);
    g.beginPath(); g.moveTo(-s*0.05,-s*0.53); g.lineTo(-s*0.20,-s*0.76); g.stroke();
    g.beginPath(); g.moveTo(s*0.05,-s*0.53); g.lineTo(s*0.20,-s*0.76); g.stroke();
  } else {
    g.fillStyle=col; g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-s*0.75,-s*0.55); g.lineTo(-s*0.35,-s*1.18); g.lineTo(-s*0.14,-s*0.60); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(s*0.75,-s*0.55); g.lineTo(s*0.35,-s*1.18); g.lineTo(s*0.14,-s*0.60); g.closePath(); g.fill(); g.stroke();

function totalTime(){ var b=bonus(); return 45+upLv('time')*2+b.time; }
function resetRound(){

  lives=3+b.life+upLv('life');

}
function wantCount(){ return Math.min(3+round+upLv('auto')/4, 9); }
function spawnOne(){
  var r=rnd(28,44), t, n=0;
  // phai luon de muc tieu nam duoi HUD (PLAY_TOP), khong chong chu
  var minY=PLAY_TOP+r+8, maxY=gy-r-14;

  while(n<26 && targets.some(function(o){ return Math.hypot(o.x-t.x,o.y-t.y)<o.r+t.r+26; }));
  targets.push(t);
}
function refill(){ while(targets.length<wantCount()) spawnOne(); }

/* =================== CHƠI =================== */
function startRound(){ curMap=MAP(S.map); resetRound(); st=ST_PLAY; SFX.start(); happy(); }
function tap(x,y){
  if(st!==ST_PLAY) return;
  for(var i=0;i<targets.length;i++)
    if(Math.hypot(targets[i].x-x,targets[i].y-y)<=targets[i].r*1.20){ hitTarget(targets[i],i); return; }
  combo=0; SFX.miss();
}
function hitTarget(t,idx,silent){
  targets.splice(idx,1);
  var b=bonus(), critP=upLv('crit')*0.03, gold=t.kind==='gold';
  var pts=(10+combo*(2+upLv('combo')))*b.pts*(1+upLv('tap')*0.2);
  if(gold) pts*=5;
  var crit=Math.random()<critP; if(crit) pts*=3;
  if(frenzyT>0) pts*=3;
  pts=Math.round(pts);
  score+=pts; combo++; if(combo>bestCombo) bestCombo=combo;

  var rate=(1+upLv('coin')*0.10)*b.coin*curMap.coin*(1+upLv('x2')*0.25);
  var gain=Math.max(1,Math.round(pts*0.10*rate));
  if(gold) gain=Math.round(gain*2.5);
  if(crit) gain=Math.round(gain*1.5);
  coinsRun+=gain; S.coins+=gain;

  if(silent){ if(targets.length<wantCount()) spawnOne(); return; }
  var col=gold?'#ffd43b':(crit?'#ff6b6b':'#fff');
  burst(t.x,t.y,gold?'#ffd43b':(crit?'#ff6b6b':pick(PAL)),gold?26:14,gold?9:6);
  // chi hien so diem khi cham nhanh lien tiep, tranh chu chong len nhau
  var now=performance.now();
  if(crit||gold||now-lastPop>150){ popAt(t.x,t.y-10,'+'+pts,col,crit?28:20); lastPop=now; }
  if(crit){ popAt(t.x,t.y-44,'CHÍNH XÁC!','#ff6b6b',20); SFX.gold(); doShake(9); doFlash('#ff6b6b',0.28); }
  else if(gold){ SFX.gold(); popAt(t.x,t.y-44,'SAO VÀNG!','#ffd43b',20); doShake(7); doFlash('#ffd43b',0.22); confetti(16); }
  else { SFX.hit(combo); doShake(1.6+Math.min(4,combo*0.28)); }
  if(combo%10===0){
    SFX.combo(combo); popAt(t.x,t.y-64,'CHUỖI x'+combo,'#4dabf7',22);
    confetti(10); doShake(5);
  }
  var thr=10-upLv('frenzy');
  if(thr>0 && combo===thr && frenzyT<=0){
    frenzyT=5; SFX.frenzy(); doFlash('#f76707',0.4); confetti(34);
    popAt(W/2,gy*0.42,'FRENZY!','#f76707',36);
  }
  if(targets.length<wantCount()) spawnOne();
}
function autoTap(dt){
  var rate=0.35+upLv('auto')*0.30;
  if(rate<=0.35||!targets.length) return;
  autoT-=dt; if(autoT>0) return; autoT=1/rate;
  var t=targets[Math.floor(Math.random()*targets.length)];
  hitTarget(t,targets.indexOf(t),true);
}
function endRound(){
  clearFx(); st=ST_OVER; S.plays++;
  var last=today();
  if(last!==S.lastDay) S.streak=(S.lastDay&&diffDays(S.lastDay,last)===1)?S.streak+1:1;
  S.lastDay=last;
  if(score>S.best) S.best=score;
  S.total+=score; save(); gameOverSDK(score); SFX.over();
}

    var bw3=Math.min(112,W*0.26), bx3=W-18-bw3, by3=y+(rowH-10)/2-24;
    if(has) btn(bx3,by3,bw3,48,'✔',20,'#adb5bd',false);
    else if(maxed) btn(bx3,by3,bw3,48,'TỐI ĐA',14,'#adb5bd',false);
    else btn(bx3,by3,bw3,48,money(cost),16,S.coins>=cost?(isUp?'#4dabf7':'#f06595'):'#ced4da',S.coins>=cost);
  }
  g.fillStyle='rgba(240,246,255,.99)'; g.fillRect(0,H-70,W,70);
  g.fillStyle='rgba(0,0,0,.08)'; g.fillRect(0,H-70,W,1);
  btn((W-Math.min(170,W*0.5))/2,H-58,Math.min(170,W*0.5),46,'VỀ MENU',16,'#868e96');
}
function drawPick(){
  panel(0,0,W,H,0,0.95);
  txt('CHỌN BẢN ĐỒ',W/2,40,Math.min(24,W*0.046),'#1b4b73');
  var cardW=Math.min(180,W*0.52), cardH=Math.min(150,cardW*0.82);
  var gap=Math.min(26,W*0.045), spacing=cardW+gap;
  var x0=(W-(cardW*MAPS.length+gap*(MAPS.length-1)))/2+cardW/2, i;
  for(i=0;i<MAPS.length;i++){
    var cx=x0+i*spacing, cy=H*0.34, m=MAPS[i];
    var has=S.maps.indexOf(m.id)>=0, sel=(i===pickIdx);
    g.save(); if(sel){ g.shadowColor='#4dabf7'; g.shadowBlur=18; }
    panel(cx-cardW/2,cy-cardH/2,cardW,cardH,18,0.97); g.restore();
    g.save(); g.beginPath(); rr(cx-cardW/2+8,cy-cardH/2+8,cardW-16,cardH*0.52,12); g.clip();
    var grd=g.createLinearGradient(0,cy-cardH/2+8,0,cy+cardH*0.26);
    grd.addColorStop(0,m.sky[0]); grd.addColorStop(1,m.sky[1]);
    g.fillStyle=grd; g.fillRect(cx-cardW/2,cy-cardH/2,cardW,cardH);
    g.fillStyle=m.mid; g.fillRect(cx-cardW/2,cy+cardH*0.06,cardW,cardH);
    g.fillStyle=m.ground; g.fillRect(cx-cardW/2,cy+cardH*0.15,cardW,cardH);
    g.restore();
    fitTxt(m.name,cx,cy+cardH*0.30,cardW-14,Math.min(14,W*0.026),'#1b4b73');
    if(has){
      txt('✔ Đã mở',cx,cy+cardH*0.30+20,12,'#2b9e44');
      if(sel) txt('▶ Đang chọn',cx,cy+cardH*0.30+38,12,'#4dabf7');
    } else {
      txt('🔒 '+money(m.cost)+' xu',cx,cy+cardH*0.30+20,12,'#e8590c');
      if(S.coins>=m.cost) txt('✔ Đủ tiền!',cx,cy+cardH*0.30+38,12,'#2b9e44');
    }
  }
  fitTxt('← → chuyển bản đồ',W/2,H*0.60,Math.min(260,W*0.8),13,'#868e96');
  var bw=Math.min(280,W*0.66), by=H*0.66, m2=MAPS[pickIdx], has2=S.maps.indexOf(m2.id)>=0;
  if(has2) btn((W-bw)/2,by,bw,58,'CHƠI BẢN ĐỒ NÀY',18,'#ff922b');
  else if(S.coins>=m2.cost) btn((W-bw)/2,by,bw,58,'MỞ VỚI '+money(m2.cost)+' XU',18,'#51cf66');
  else btn((W-bw)/2,by,bw,58,'CẦN '+money(m2.cost)+' XU',17,'#adb5bd');
  btn((W-Math.min(200,W*0.5))/2,by+68,Math.min(200,W*0.5),48,'QUAY LẠI',16,'#868e96');
  coinBar(H-52,true);
}
function drawStats(){
  g.fillStyle='rgba(240,246,255,.98)'; g.fillRect(0,0,W,H);
  header('THÀNH TÍCH');
  var pw=Math.min(350,W*0.90), ph=Math.min(410,H*0.86), px=(W-pw)/2, py=(H-ph)/2+12;
  panel(px,py,pw,ph,24,1);
  var rows=[
    ['Điểm cao nhất', money(S.best)],
    ['Tổng điểm', money(S.total)],
    ['Số ván đã chơi', String(S.plays)],
    ['Chuỗi ngày', 'x'+S.streak],
    ['Mèo đã nuôi', S.cats.length+' / '+CATS.length],
    ['Bản đồ đã mở', S.maps.length+' / '+MAPS.length]
  ], i, y;
  for(i=0;i<rows.length;i++){
    y=py+44+i*42;
    txt(rows[i][0],px+22,y,15,'#2b6b96','left');
    txt(rows[i][1],px+pw-22,y,18,'#1b4b73','right');
    if(i<rows.length-1){ g.fillStyle='rgba(0,0,0,.07)'; g.fillRect(px+22,y+21,pw-44,1); }
  }
  var sy=py+44+rows.length*42+18;
  txt('BỘ SƯU TẦM',px+22,sy,14,'#868e96','left');
  var step=(pw-50)/CATS.length;
  for(i=0;i<CATS.length;i++){
    var cx=px+32+step*(i+0.5), cy=sy+40, has=owned(CATS[i].id);
    g.globalAlpha=has?1:0.20;
    catArt(cx,cy,17,CATS[i].col,0,false);
    g.globalAlpha=1;
    if(has){
      g.fillStyle='#2b9e44'; g.beginPath(); g.arc(cx+13,cy+13,7,0,6.2832); g.fill();
      txt('✔',cx+13,cy+13,9,'#fff');
    }
  }
  btn((W-Math.min(170,W*0.5))/2,H-58,Math.min(170,W*0.5),46,'ĐÓNG',16,'#868e96');
}

/* =================== VÒNG LẶP =================== */
var last=performance.now();
function loop(now){
  var raw=Math.min(0.05,(now-last)/1000); last=now;
  var dt=raw, t=now;
  scroll+=raw*34;
  g.save();
  if(shake>0.2) g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  gy=drawBG(curMap,t);

  if(st===ST_MENU) drawMenu();
  else if(st===ST_PLAY){
    timeLeft-=raw;
    if(timeLeft<=0){ timeLeft=0; endRound(); }
    else{
      if(frenzyT>0){ frenzyT-=raw; if(frenzyT<=0) doFlash('#adb5bd',0.15); }
      if(round<3 && timeLeft<totalTime()-round*15){
        round++; SFX.levelup(); confetti(26); doFlash('#ffd43b',0.3);
        popAt(W/2,gy*0.40,'VÁN '+round,'#ff922b',30); refill();
      }
      autoTap(raw);
      var i, a, b;
      for(i=targets.length-1;i>=0;i--){
        var tg=targets[i];
        tg.x+=tg.dx*24*dt; tg.y+=tg.dy*24*dt;
        tg.rot=tg.base+Math.sin(t/700+tg.sway)*0.20;
        if(tg.x<tg.r+8||tg.x>W-tg.r-8) tg.dx*=-1;
        if(tg.y<PLAY_TOP+tg.r+8||tg.y>gy-tg.r-4) tg.dy*=-1;
      }
      for(a=0;a<targets.length;a++) for(b=a+1;b<targets.length;b++){
        var t1=targets[a],t2=targets[b], ddx=t2.x-t1.x,ddy=t2.y-t1.y;
        var dd=Math.sqrt(ddx*ddx+ddy*ddy)||0.001, mnd=t1.r+t2.r+12;
        if(dd<mnd){ var pu=(mnd-dd)*0.5, ux=ddx/dd,uy=ddy/dd;
          t1.x-=ux*pu; t1.y-=uy*pu; t2.x+=ux*pu; t2.y+=uy*pu; }
      }
      refill();
      for(i=0;i<targets.length;i++) targetArt(targets[i],t-targets[i].born);
      drawHud();
    }
  }
  else if(st===ST_OVER) drawGameOver();
  else if(st===ST_PICK) drawPick();
  else if(st===ST_SHOP) drawShop();
  else if(st===ST_STATS) drawStats();

  for(var b2=bits.length-1;b2>=0;b2--){
    var p=bits[b2]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=12*dt; p.rot+=p.vr*dt; p.life-=raw*1.5;
    if(p.life<=0){ bits.splice(b2,1); continue; }
    g.save(); g.globalAlpha=Math.max(0,p.life); g.translate(p.x,p.y); g.rotate(p.rot);
    g.fillStyle=p.col; rr(-p.r/2,-p.r/2,p.r,p.r,p.r*0.3); g.fill(); g.restore();
  }
  for(var p2=pops.length-1;p2>=0;p2--){
    var q=pops[p2]; q.y-=52*dt; q.life-=raw*2.0;
    if(q.life<=0){ pops.splice(p2,1); continue; }
    txt(q.t,q.x,q.y,q.size,q.col,'center','bold','rgba(255,255,255,.9)');
  }
  for(var c2=conf.length-1;c2>=0;c2--){
    var k2=conf[c2]; k2.x+=k2.vx*dt; k2.y+=k2.vy*dt; k2.rot+=k2.vr*dt; k2.life-=raw*0.5;
    if(k2.y>H+30){ conf.splice(c2,1); continue; }
    g.save(); g.globalAlpha=clamp(k2.life,0,1); g.translate(k2.x,k2.y); g.rotate(k2.rot);
    g.fillStyle=k2.col; g.fillRect(-k2.w/2,-k2.h/2,k2.w,k2.h); g.restore();
  }
  g.restore();
  if(shake>0.2) shake*=0.86;
  if(flash>0.01){ g.save(); g.globalAlpha=flash*0.55; g.fillStyle=flashCol; g.fillRect(0,0,W,H); g.restore(); flash*=0.90; }
  requestAnimationFrame(loop);
}

/* =================== INPUT =================== */
function onDown(x,y){
  if(st===ST_MENU){
    var b=btnRect();
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){ startRound(); return; }
    var y2=b.y+b.h+18, bw2=(b.w-14)/2;
    if(y>y2&&y<y2+56){
      if(x<b.x+bw2){ prevSt=ST_MENU; goto(ST_SHOP); scrollY=0; }
      else goto(ST_PICK);
      return;
    }
    if(y>H-80&&y<H-34){ S.muted=!S.muted; save(); }
    return;
  }
  if(st===ST_PLAY){ tap(x,y); return; }
  if(st===ST_OVER){
    var pw=Math.min(360,W*0.88), ph=Math.min(320,H*0.80), px=(W-pw)/2, py=(H-ph)/2;
    var by=py+ph-118, bh=50, bw=(pw-46)/2;
    if(y>by&&y<by+bh){
      if(x<px+18+bw) startRound();
      else { prevSt=ST_OVER; goto(ST_SHOP); scrollY=0; }
      return;
    }
    goto(ST_MENU); return;
  }
  if(st===ST_PICK){
    var mw=Math.min(280,W*0.66), my=H*0.66;
    if(y>my&&y<my+58){
      var m2=MAPS[pickIdx];
      if(S.maps.indexOf(m2.id)>=0){ S.map=m2.id; startRound(); }
      else if(S.coins>=m2.cost){ S.coins-=m2.cost; S.maps.push(m2.id); S.map=m2.id; save(); SFX.buy(); startRound(); }
      else SFX.deny();
      return;
    }
    if(y>my+68&&y<my+116){ goto(ST_MENU); return; }
    if(y<110){ pickIdx=(pickIdx+(x<W/2?-1:1)+MAPS.length)%MAPS.length; SFX.coin(); }
    return;
  }
  if(st===ST_SHOP){
    var ty=62, th=42, tw=Math.min(190,W*0.44), t0=(W-(tw*2+10))/2;
    if(y>ty&&y<ty+th){
      var nw=(x>t0+tw+5)?1:0;
      if(nw!==shopTab){ shopTab=nw; scrollY=0; SFX.coin(); }
      return;
    }
    if(y>H-70&&y<H-12){ goto(prevSt||ST_MENU); prevSt=ST_MENU; return; }
    var list=shopTab===0?UPS:CATS, top=ty+th+12, rowH=Math.min(74,H*0.13), i;
    for(i=0;i<list.length;i++){
      var ry=top+i*rowH-scrollY;
      if(y<ry||y>ry+rowH-10) continue;
      var it=list[i], isUp=shopTab===0;
      if(!isUp&&owned(it.id)) continue;
      var lv=isUp?upLv(it.id):0, cost=isUp?upCost(it.id):it.cost;
      if(isUp&&lv>=it.max) continue;
      if(S.coins>=cost){
        S.coins-=cost; SFX.buy();
        if(isUp) S.ups[it.id]=lv+1; else S.cats.push(it.id);
        save();
      } else SFX.deny();
      return;
    }
    return;
  }
  if(st===ST_STATS){
    if(y>H-72&&y<H-8) goto(ST_MENU);
  }
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); onDown(e.clientX,e.clientY); },{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='KeyM'){ S.muted=!S.muted; save(); return; }
  if(st===ST_PICK){
    if(e.code==='ArrowLeft'){ pickIdx=(pickIdx-1+MAPS.length)%MAPS.length; return; }
    if(e.code==='ArrowRight'){ pickIdx=(pickIdx+1)%MAPS.length; return; }
  }
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(st===ST_PLAY) tap(rnd(0,W),rnd(0,H));
    else if(st===ST_MENU||st===ST_OVER) startRound();
  }
});
cv.addEventListener('wheel',function(e){ if(st===ST_SHOP) scrollY+=e.deltaY; },{passive:true});

/* =================== OFFLINE =================== */
function offlineCheck(){
  var now=Date.now(), mins=(now-(S.lastSeen||now))/60000;
  S.lastSeen=now;
  if(mins>5){
    var rate=(1+upLv('coin')*0.10)*bonus().coin;
    var gain=Math.floor(Math.min(mins/60*rate*40,400+rate*180));
    if(gain>0){ S.coins+=gain;
      setTimeout(function(){ popAt(W/2,H*0.45,'+'+money(gain)+' xu khi bạn vắng mặt!','#ff922b',20); },600); }
  }
  save();
}
setInterval(function(){ S.lastSeen=Date.now(); save(); },20000);

/* =================== SDK =================== */
var poki=(function(){ try{ return new PokiSDK(); }catch(e){ return null; } })();
var crazy=(function(){ try{ return window.CrazyGames&&window.CrazyGames.SDK?new CrazyGames.SDK():null; }catch(e){ return null; } })();
function each(fn){ try{ if(poki) fn(poki); }catch(e){} try{ if(crazy) fn(crazy); }catch(e){} }
each(function(s){ if(s.loadingStart) s.loadingStart(); });
function happy(){ each(function(s){ if(s.happyTime) s.happyTime(); }); }
function gameOverSDK(sc){ each(function(s){ if(s.gameOver) s.gameOver({score:sc,best:S.best}); }); }
each(function(s){ if(s.gameplayPause) s.gameplayPause(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) pauseAll(); });
function pauseAll(){
  each(function(s){ if(s.gameplayPause) s.gameplayPause(); });
  if(st===ST_PLAY){ clearFx(); st=ST_OVER; timeLeft=0; }
  S.lastSeen=Date.now(); save();
}

/* =================== KHỞI ĐỘNG =================== */
load(); offlineCheck();
if(S.maps.indexOf(S.map)<0) S.map='garden';
curMap=MAP(S.map); initAmb(curMap);
requestAnimationFrame(loop);
setTimeout(function(){ each(function(s){ if(s.loadingFinished) s.loadingFinished(); }); },250);
</script>
