          total:0, best:0, plays:0, streak:0, lastDay:'', lastSeen:0, muted:false, bossBeat:0 };
function load(){
  try{ var raw=localStorage.getItem(SAVE_KEY); if(raw){ var d=JSON.parse(raw);
    for(var k in S) if(d[k]!==undefined) S[k]=d[k]; } }catch(e){}
  if(!S.cats||!S.cats.length) S.cats=['gold'];
  if(!S.maps||!S.maps.length) S.maps=['garden'];
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function money(n){ n=Math.floor(n); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function today(){ return new Date().toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* =================== BẢN ĐỒ =================== */

var CATS=[
  { id:'gold',   name:'Mèo Vàng',     col:'#ffd43b', cost:0,     coin:1, pts:1, time:0, life:0, desc:'Người bạn đầu tiên' },

  { id:'blue',   name:'Mèo Xanh',     col:'#74c0fc', cost:1200,  coin:1, pts:1, time:6, life:0, desc:'+6 giây mỗi ván' },
  { id:'purple', name:'Mèo Tím',      col:'#b197fc', cost:3200,  coin:1, pts:1.20, time:0, life:0, desc:'+20% điểm' },
  { id:'orange', name:'Mèo Cam',      col:'#ffa94d', cost:8000,  coin:1, pts:1, time:0, life:1, desc:'+1 mạng · sót bớt nghiêm' },
  { id:'silver', name:'Mèo Bạc',      col:'#adb5bd', cost:19000, coin:1.10, pts:1.10, time:0, life:0, desc:'+10% xu · +10% điểm' },
  { id:'rainbow',name:'Mèo Cầu Vồng', col:'#f06595', cost:58000, coin:1.30, pts:1.20, time:4, life:1, desc:'+30% xu · +4s · +1 mạng' }
];
function CAT(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return CATS[0]; }
function owned(id){ return S.cats.indexOf(id)>=0; }
function bonus(){ var b={coin:1,pts:1,time:0,life:0};
  for(var i=0;i<S.cats.length;i++){ var c=CAT(S.cats[i]); b.coin*=c.coin; b.pts*=c.pts; b.time+=c.time; b.life+=c.life; }
  return b; }

/* =================== ÂM THANH =================== */
var AC=null;
function ac(){ if(AC) return AC; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } return AC; }
function tone(f,dur,type,vol,slide,delay){
  var a=ac(); if(!a||S.muted) return;
  if(a.state==='suspended') a.resume();
  var t0=a.currentTime+(delay||0);
  var o=a.createOscillator(), gn=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+dur);
  gn.gain.setValueAtTime(0.0001,t0);
  gn.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+dur+0.03);
}
var SFX={
  hit:function(c){ tone(760+(c||0)*42,0.09,'triangle',0.17,360); },
  gold:function(){ [0,1,2].forEach(function(i){ tone(880+i*330,0.15,'sine',0.19,300,i*0.05); }); },
  boss:function(){ tone(180,0.12,'square',0.16,-40); },
  bossDie:function(){ [392,523,659,784,1046,1318].forEach(function(f,i){ tone(f,0.22,'square',0.17,null,i*0.08); }); },
  combo:function(n){ [0,1,2,3].forEach(function(i){ tone(523*(1+0.26*i)+(n||0)*30,0.13,'square',0.12,200,i*0.05); }); },
  miss:function(){ tone(300,0.22,'sawtooth',0.13,-180); },
  buy:function(){ tone(523,0.10,'sine',0.20); tone(784,0.14,'sine',0.20,null,0.09); tone(1046,0.18,'sine',0.18,null,0.18); },
  deny:function(){ tone(200,0.10,'square',0.10); tone(150,0.14,'square',0.09,null,0.09); },
  start:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.13,'sine',0.18,null,i*0.07); }); },
  over:function(){ [523,440,349,262].forEach(function(f,i){ tone(f,0.30,'triangle',0.18,null,i*0.14); }); },
  wave:function(){ [659,784,988,1318].forEach(function(f,i){ tone(f,0.20,'sine',0.20,null,i*0.09); }); },
  frenzy:function(){ [392,523,659,784,1046].forEach(function(f,i){ tone(f,0.18,'square',0.15,null,i*0.06); }); },
  coin:function(){ tone(1200,0.07,'square',0.07,null,0); tone(1600,0.09,'square',0.06,null,0.06); }
};

/* =================== CANVAS =================== */
var cv=document.getElementById('c'), g=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* =================== TIỆN ÍCH VẼ =================== */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function txt(s,x,y,size,col,align,weight,stroke){
  g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif';
  g.textAlign=align||'center'; g.textBaseline='middle';
  if(stroke){ g.lineWidth=Math.max(3,size*0.16); g.lineJoin='round'; g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=col; g.fillText(s,x,y);
}
function fitTxt(s,x,y,maxW,size,col,align,weight,stroke){
  g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif';
  var w=g.measureText(s).width;
  if(w>maxW){ size=Math.max(10,Math.floor(size*(maxW/w))); g.font=(weight||'bold')+' '+size+'px Trebuchet MS, Verdana, sans-serif'; }
  g.textAlign=align||'center'; g.textBaseline='middle';
  if(stroke){ g.lineWidth=Math.max(3,size*0.16); g.lineJoin='round'; g.strokeStyle=stroke; g.strokeText(s,x,y); }
  g.fillStyle=col; g.fillText(s,x,y);
}
function panel(x,y,w,h,r,a){ g.fillStyle='rgba(255,255,255,'+(a===undefined?0.94:a)+')'; rr(x,y,w,h,r); g.fill(); }
function btn(x,y,w,h,label,size,fill,active){
  g.save(); if(!active) g.translate(0,3);
  g.fillStyle='rgba(0,0,0,.22)'; rr(x,y,w,h,Math.min(18,h/2)); g.fill();
  g.fillStyle=fill; rr(x,y,w,h,Math.min(18,h/2)); g.fill(); g.restore();
  txt(label,x+w/2,y+h/2+1,size,'#fff','center');
}
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hex2rgba(h,a){
  var n=parseInt(h.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* =================== HẠT / HIỆU ỨNG =================== */
var bits=[], pops=[], conf=[], rings=[], shake=0, flash=0, flashCol='#fff', hitStop=0, lastPop=0;
function burst(x,y,col,n,spd){
  for(var i=0;i<n;i++){ if(bits.length>380) break;
    var a=rnd(0,6.2832), s=rnd(1,spd||6);
    bits.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:rnd(2,6),rot:rnd(0,6),vr:rnd(-9,9)});
  }
}
function popAt(x,y,t,col,size){ if(pops.length>22) pops.shift(); pops.push({x:x,y:y,t:t,life:1,col:col,size:size||24}); }
function confetti(n,col){
  for(var i=0;i<n;i++){ if(conf.length>170) break;
    conf.push({x:rnd(0,W),y:rnd(-60,-5),vx:rnd(-40,40),vy:rnd(70,220),life:1,
      col:col||pick(['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#b197fc','#ff922b']),
      w:rnd(5,11),h:rnd(8,15),rot:rnd(0,6.28),vr:rnd(-7,7)});
  }
}
function ring(x,y,col,r){ if(rings.length>16) rings.shift(); rings.push({x:x,y:y,r0:6,r1:r||60,life:1,col:col}); }
function doShake(a){ shake=Math.min(24,shake+a); }
function doFlash(c,a){ flashCol=c; flash=Math.min(1,flash+a); }
function freeze(ms){ hitStop=Math.max(hitStop,ms); }
function clearFx(){ bits=[]; conf=[]; pops=[]; rings=[]; shake=0; flash=0; hitStop=0; }
function goto(ns){ clearFx(); st=ns; }

/* =================== VẼ NHÂN VẬT =================== */
function faceAt(x,y,s,mood){
  g.save(); g.translate(x,y);
  var ex=s*0.26, ey=-s*0.06, er=s*0.15;
  g.fillStyle='#fff'; g.beginPath(); g.arc(-ex,ey,er,0,6.2832); g.fill();
  g.beginPath(); g.arc(ex,ey,er,0,6.2832); g.fill();
  g.fillStyle='#2b2430';
  var lx=er*0.14;
  if(mood==='hurt'){ lx=-lx; }
  g.beginPath(); g.arc(-ex+lx,ey+er*0.12,er*0.54,0,6.2832); g.fill();
  g.beginPath(); g.arc( ex+lx,ey+er*0.12,er*0.54,0,6.2832); g.fill();
  g.fillStyle='rgba(255,125,150,.42)';
  g.beginPath(); g.arc(-s*0.48,s*0.16,s*0.17,0,6.2832); g.fill();
  g.beginPath(); g.arc( s*0.48,s*0.16,s*0.17,0,6.2832); g.fill();
  g.strokeStyle='#2b2430'; g.lineWidth=Math.max(2,s*0.07); g.lineCap='round';
  if(mood==='hurt'){ g.beginPath(); g.moveTo(-s*0.16,s*0.14); g.lineTo(s*0.16,s*0.14); g.stroke(); }
  else { g.beginPath(); g.arc(0,s*0.08,s*0.21,0.32,Math.PI-0.32); g.stroke(); }
  g.restore();
}
function catArt(x,y,s,col,face){
  g.save(); g.translate(x,y);
  g.strokeStyle='rgba(35,25,55,.32)'; g.lineWidth=Math.max(2,s*0.08); g.lineJoin='round';
  g.fillStyle=col;
  g.beginPath(); g.moveTo(-s*0.78,-s*0.50); g.lineTo(-s*0.40,-s*1.22); g.lineTo(-s*0.10,-s*0.56); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo( s*0.78,-s*0.50); g.lineTo( s*0.40,-s*1.22); g.lineTo( s*0.10,-s*0.56); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-s*0.66,-s*0.58); g.lineTo(-s*0.40,-s*1.06); g.lineTo(-s*0.24,-s*0.60); g.closePath(); g.fill();
  g.beginPath(); g.moveTo( s*0.66,-s*0.58); g.lineTo( s*0.40,-s*1.06); g.lineTo( s*0.24,-s*0.60); g.closePath(); g.fill();
  g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill(); g.stroke();
  g.fillStyle='rgba(0,0,0,.09)'; g.beginPath(); g.arc(0,s*0.36,s*0.46,0,6.2832); g.fill();
  g.fillStyle='rgba(255,255,255,.30)';
  g.beginPath(); g.ellipse(-s*0.34,-s*0.34,s*0.26,s*0.18,-0.5,0,6.2832); g.fill();
  g.restore();
  if(face) faceAt(x,y,s);
}

/* =================== NỀN =================== */
var scroll=0, RIDGE=[];
function buildRidge(W){
  RIDGE=[];
  for(var i=0;i<70;i++) RIDGE.push({ y:Math.sin(i*0.6)*18+Math.sin(i*0.23)*12, h:30+((i*37)%26) });
}
function cloud(x,y,s,a){
  g.save(); g.globalAlpha=(a===undefined?1:a); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#fff';
  g.beginPath(); g.arc(0,0,22,0,6.2832); g.arc(26,8,17,0,6.2832);
  g.arc(-26,9,16,0,6.2832); g.arc(6,-14,20,0,6.2832); g.fill(); g.restore();
}
function pine(x,y,s,col){
  g.fillStyle='#5c3f24'; g.fillRect(x-s*0.07,y-s*0.24,s*0.14,s*0.28);
  g.fillStyle=col;
  for(var i=0;i<3;i++){ var yy=y-s*0.20-i*s*0.24, ww=s*(0.46-i*0.11);
    g.beginPath(); g.moveTo(x,yy-s*0.44); g.lineTo(x-ww,yy); g.lineTo(x+ww,yy); g.closePath(); g.fill(); }
}
function palm(x,y,s){
  g.strokeStyle='#7a4d22'; g.lineWidth=s*0.10; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+s*0.16,y-s*0.45,x+s*0.05,y-s*0.88); g.stroke();
  g.fillStyle='#2f9e44';
  for(var i=0;i<6;i++){ g.save(); g.translate(x+s*0.05,y-s*0.88); g.rotate(-Math.PI+i*0.52);
    g.beginPath(); g.ellipse(s*0.32,0,s*0.36,s*0.10,0,0,6.2832); g.fill(); g.restore(); }
  g.fillStyle='#c9a227'; g.beginPath(); g.arc(x+s*0.02,y-s*0.94,s*0.09,0,6.2832); g.fill();
}
function rock(x,y,s,c){
  g.fillStyle=c; g.beginPath();
  g.moveTo(x-s,y); g.lineTo(x-s*0.55,y-s*0.72); g.lineTo(x+s*0.2,y-s*0.92);
  g.lineTo(x+s*0.78,y-s*0.5); g.lineTo(x+s,y); g.closePath(); g.fill();
}
function planet(x,y,s,c,ring){
  g.save(); g.translate(x,y);
  if(ring){ g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=s*0.14;
    g.beginPath(); g.ellipse(0,0,s*1.6,s*0.42,-0.35,0,6.2832); g.stroke(); }
  g.fillStyle=c; g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill();
  g.fillStyle='rgba(0,0,0,.16)'; g.beginPath(); g.arc(s*0.32,s*0.22,s*0.68,0,6.2832); g.fill();
  g.fillStyle='rgba(255,255,255,.32)'; g.beginPath(); g.arc(-s*0.32,-s*0.32,s*0.30,0,6.2832); g.fill();
  g.restore();
}
function drawBG(m,t){
  var grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,m.sky[0]); grd.addColorStop(1,m.sky[1]);
  g.fillStyle=grd; g.fillRect(-30,-30,W+60,H+60);
  var gy=H-m.groundH, i, px, c;

  // quang sau lung (mem, khong phai tam giac cung)
  g.save();
  var lg=g.createRadialGradient(W*0.78,gy*0.16,8,W*0.78,gy*0.16,Math.max(W,H)*0.20);
  lg.addColorStop(0,hex2rgba(m.glow,0.22)); lg.addColorStop(1,hex2rgba(m.glow,0));
  g.fillStyle=lg; g.fillRect(-30,-30,W+60,H+60); g.restore();

  if(m.id==='space'){
    g.fillStyle='rgba(255,255,255,.9)';
    for(i=0;i<80;i++){
      var sx=((i*167+31)%997)/997*W, sy=((i*89+17)%601)/601*gy;
      g.globalAlpha=(0.3+0.7*Math.abs(Math.sin(t/700+i)))*0.9; g.fillRect(sx,sy,2,2);
    }
    g.globalAlpha=1;
    planet(W*0.18,gy*0.26,32,'#ff922b',true);
    planet(W*0.80,gy*0.16,19,'#74c0fc',false);
    planet(W*0.50,gy*0.58,12,'#f783ac',false);
  } else if(m.id==='night'){
    // mat trang khuyết: ve bang duong vong, khong che bang dia den
    g.fillStyle='#fdf6c8';
    g.beginPath(); g.arc(W*0.76,gy*0.20,29,0,6.2832);

    for(i=0;i<5;i++) g.fillRect(((t*0.07+i*170)%(W+140))-70,gy-22+((i*9)%9),54,2.5);
    g.fillStyle='rgba(255,255,255,.85)'; g.fillRect(-30,gy-2,W+60,3.5);

  } else if(kind==='butterfly'){

    g.fillStyle=col;
    g.save(); g.scale(0.55+fl*0.45,1);
    g.beginPath(); g.ellipse(-s*0.40,-s*0.24,s*0.48,s*0.38,-0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(s*0.40,-s*0.24,s*0.48,s*0.38,0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(-s*0.32,s*0.38,s*0.36,s*0.30,0.5,0,6.2832); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(s*0.32,s*0.38,s*0.36,s*0.30,-0.5,0,6.2832); g.fill(); g.stroke();
    g.restore();
    g.fillStyle='#5a3d2b';
    g.beginPath(); g.ellipse(0,0,s*0.09,s*0.42,0,0,6.2832); g.fill();

    g.restore();
    g.fillStyle=col; g.beginPath(); g.arc(0,0,s*0.86,0,6.2832); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.28)';
    g.beginPath(); g.ellipse(-s*0.32,-s*0.34,s*0.24,s*0.16,-0.5,0,6.2832); g.fill();

function drawBoss(x,y,s,t,alpha){
  g.save(); g.globalAlpha=alpha===undefined?1:alpha; g.translate(x,y);
  var wob=Math.sin(t*2.2)*0.08;
  g.save(); g.rotate(wob); g.scale(1,0.94+Math.sin(t*2.2)*0.06);

  g.fillStyle='#5f3dc4';

  g.beginPath(); g.moveTo(s*0.85,-s*0.46); g.lineTo(s*0.44,-s*1.16); g.lineTo(s*0.12,-s*0.54); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.arc(0,0,s,0,6.2832); g.fill(); g.stroke();

  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=Math.max(2,s*0.045);

function drawTarget(t,now,alpha){
  var s=t.r*(1+0.10*Math.sin(now/200+t.ph));
  g.save(); g.globalAlpha=alpha===undefined?1:alpha;
  // vong bao + quang
  g.save(); g.translate(t.x,t.y);

  g.fill();
  g.lineWidth=t.boss?4:3; g.strokeStyle=t.kind==='gold'?'#ffd43b':(t.boss?'#b197fc':'rgba(255,255,255,.72)');
  if(t.kind==='gold'){ g.shadowColor='#ffd43b'; g.shadowBlur=20; }
  g.stroke(); g.shadowBlur=0; g.restore();
  if(t.boss) drawBoss(t.x,t.y,s,now/1000);
  else if(t.kind==='gold'){
    g.save(); g.translate(t.x,t.y); g.rotate(now/700);
    g.fillStyle='#ffd43b'; g.strokeStyle='rgba(120,80,0,.35)'; g.lineWidth=Math.max(2,s*0.08); g.lineJoin='round';
    g.beginPath();
    for(var i=0;i<10;i++){ var a=-1.5708+i*0.6283, q=(i%2?s*0.46:s);
      var px=Math.cos(a)*q, py=Math.sin(a)*q; if(i===0) g.moveTo(px,py); else g.lineTo(px,py); }
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.55)';
    g.beginPath(); g.ellipse(-s*0.24,-s*0.28,s*0.16,s*0.11,-0.6,0,6.2832); g.fill();

    faceAt(t.x,t.y,s);

function makeFalling(wave){
  var m=curMap, r=rnd(26,42);
  var luck=upLv('luck')*0.03;
  var kind=Math.random()<luck?'gold':pick(KINDS);
  var b=bonus();
  var fast=(88+wave*9)*m.speed*rnd(0.88,1.12);
  return { x:rnd(56,W-56), y:-r-rnd(0,34), r:r, kind:kind, col:pick(PAL),
           vy:fast, vx:rnd(-14,14), ph:rnd(0,6.28), boss:false, hp:1, maxhp:1 };
}
function makeBoss(wave){
  var hp=Math.round((5+wave*2.2)*(1+upLv('tap')*0.10));
  return { x:W/2, y:-110, r:Math.min(62,Math.min(W,H)*0.10), kind:'boss', col:'#5f3dc4',
           vy:(26+wave*1.6)*curMap.speed, vx:0, ph:0, boss:true, hp:hp, maxhp:hp, dir:1, speed:34 };
}

/* =================== TRẠNG THÁI =================== */
var ST_MENU=0, ST_PLAY=1, ST_OVER=2, ST_SHOP=3, ST_STATS=4, ST_PICK=5;
var st=ST_MENU, prevSt=ST_MENU;
var score=0, coinsRun=0, combo=0, bestCombo=0, lives=5, wave=1, timeLeft=50;
var targets=[], spawnT=0, frenzyT=0, autoT=0, bossNext=18, bossAlive=false;
var gy=0, curMap=MAP('garden'), pickIdx=0, shopTab=0, scrollY=0;
var PLAY_TOP=96;
function groundY(){ return H-curMap.groundH; }

function totalTime(){ var b=bonus(); return 50+upLv('time')*3+b.time; }
function missCost(){ return curMap.miss; }
function resetRound(){
  var b=bonus();
  score=0; coinsRun=0; combo=0; bestCombo=0; wave=1;
  lives=9+b.life+upLv('life');
  timeLeft=totalTime();
  targets=[]; clearFx(); frenzyT=0; spawnT=0; bossNext=18; bossAlive=false;
  buildRidge(W);
  // san muc tieu ngay: da nam san tren man hinh de bam duoc ngay,
  // phan bo deu doc xuong de khong na tang
  var gyy=groundY(), n=wantCount();
  // san muc tieu ngay: trai deu theo lan va theo chieu cao de khong
  // duong nao cung cham dat cung luc (qua sot khong doi)
  var n=wantCount(), laneW=(W-112)/n;
  for(var i=0;i<n;i++){
    var t=makeFalling(1);
    t.x=clamp(56+laneW*(i+0.5)+rnd(-laneW*0.22,laneW*0.22),t.r+8,W-t.r-8);
    t.y=PLAY_TOP+40+i*(gyy*0.62-PLAY_TOP)/(n-1||1);
    targets.push(t);
  }
}
function startRound(){ curMap=MAP(S.map); resetRound(); st=ST_PLAY; SFX.start(); happy(); }
function tap(x,y){
  if(st!==ST_PLAY) return;
  for(var i=0;i<targets.length;i++){
    var t=targets[i], rr2=(t.boss?t.r*1.06:t.r*1.22);
    if(Math.hypot(t.x-x,t.y-y)<=rr2){ hitTarget(t,i); return; }
  }
  combo=0;
}
function hitTarget(t,idx,silent){
  var b=bonus(), critP=upLv('crit')*0.03, gold=t.kind==='gold';
  var pts=(10+combo*(2+upLv('combo')))*b.pts*(1+upLv('tap')*0.25);
  if(gold) pts*=5;
  var crit=Math.random()<critP; if(crit) pts*=3;
  if(frenzyT>0) pts*=3;
  pts=Math.round(pts);

  if(t.boss){
    t.hp--; t.x+=t.dir*(6+crit?0:0);
    if(!silent){
      burst(t.x,t.y,'#b197fc',crit?26:16,7); ring(t.x,t.y,'#b197fc',70);
      SFX.boss(); doShake(crit?9:5); freeze(crit?70:35);
      popAt(t.x,t.y-t.r-14,'-'+(crit?3:1),'#ffd43b',20);
    }
    if(t.hp<=0){
      targets.splice(idx,1); bossAlive=false; bossNext=Math.max(14,24-wave*1.5);
      var bp=200+wave*60; score+=bp; combo++;
      if(!silent){
        SFX.bossDie(); doShake(16); doFlash('#ffd43b',0.45); freeze(160);
        confetti(48); burst(t.x,t.y,'#ffd43b',40,11);
        popAt(t.x,t.y-20,'HẠ GỤC!','#ffd43b',34);
        popAt(t.x,t.y+22,'+'+bp,'#fff',26);
      }
      var rate=(1+upLv('coin')*0.12)*b.coin*curMap.coin*(1+upLv('x2')*0.25);
      var cg=Math.round(bp*0.10*rate); coinsRun+=cg; S.coins+=cg;
      S.bossBeat++;
      if(!silent) SFX.coin();
    }
    if(targets.length<wantCount()) spawnOne();
    return;
  }

  targets.splice(idx,1);
  score+=pts; combo++; if(combo>bestCombo) bestCombo=combo;
  var rate2=(1+upLv('coin')*0.12)*b.coin*curMap.coin*(1+upLv('x2')*0.25);
  var gain=Math.max(1,Math.round(pts*0.10*rate2));
  if(gold) gain=Math.round(gain*2.5);
  if(crit) gain=Math.round(gain*1.5);
  coinsRun+=gain; S.coins+=gain;

  if(silent){ if(targets.length<wantCount()) spawnOne(); return; }
  var col=gold?'#ffd43b':(crit?'#ff6b6b':'#fff');
  burst(t.x,t.y,gold?'#ffd43b':(crit?'#ff6b6b':t.col),gold?26:13,gold?9:6);
  ring(t.x,t.y,gold?'#ffd43b':'#fff',gold?78:46);
  var now=performance.now();
  if(crit||gold||now-lastPop>150){ popAt(t.x,t.y-12,'+'+pts,col,crit?28:20); lastPop=now; }
  if(crit){ popAt(t.x,t.y-46,'CHÍNH XÁC!','#ff6b6b',20); SFX.gold(); doShake(9); doFlash('#ff6b6b',0.26); freeze(55); }
  else if(gold){ SFX.gold(); popAt(t.x,t.y-46,'SAO VÀNG!','#ffd43b',20); doShake(7); doFlash('#ffd43b',0.22); confetti(16); freeze(40); }
  else { SFX.hit(combo); doShake(1.4+Math.min(4,combo*0.25)); }
  if(combo%10===0){ SFX.combo(combo); popAt(t.x,t.y-70,'CHUỖI x'+combo,'#4dabf7',22); confetti(10); doShake(5); }
  var thr=12-upLv('frenzy');
  if(thr>0&&combo===thr&&frenzyT<=0){
    frenzyT=6; SFX.frenzy(); doFlash('#f76707',0.42); confetti(34);
    popAt(W/2,gy*0.40,'FRENZY!','#f76707',36);
  }
}
function wantCount(){ return Math.min(5+wave, 11); }
function spawnOne(){ targets.push(makeFalling(wave)); }
function autoTap(dt){
  var rate=0.30+upLv('auto')*0.28;
  if(rate<=0.30) return;
  autoT-=dt; if(autoT>0) return; autoT=1/rate;
  var bs=targets.filter(function(t){ return t.boss && t.y>-t.r; });
  if(bs.length){ var bb=bs[0]; hitTarget(bb,targets.indexOf(bb),true); return; }
  var cand=targets.filter(function(t){ return !t.boss&&t.y>PLAY_TOP; });
  if(!cand.length) return;
  var t=cand[0];
  hitTarget(t,targets.indexOf(t),true);
}
function endRound(){
  clearFx(); targets=[]; bossAlive=false; st=ST_OVER; S.plays++;
  var last=today();
  if(last!==S.lastDay) S.streak=(S.lastDay&&diffDays(S.lastDay,last)===1)?S.streak+1:1;
  S.lastDay=last;
  if(score>S.best) S.best=score;
  S.total+=score; save(); gameOverSDK(score); SFX.over();
}

/* =================== VÒNG LẶP =================== */
var last=performance.now();
function loop(now){
  var raw=Math.min(0.05,(now-last)/1000); last=now;
  if(hitStop>0){ hitStop-=raw*1000; raw=0; }
  var dt=raw, t=now;
  scroll+=raw*34;
  g.save();
  if(shake>0.2) g.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  gy=drawBG(curMap,t);

  if(st===ST_MENU) drawMenu();
  else if(st===ST_PLAY){
    timeLeft-=raw;
    if(timeLeft<=0){ timeLeft=0; endRound(); }
    else{
      if(frenzyT>0){ frenzyT-=raw; if(frenzyT<=0) doFlash('#adb5bd',0.12); }
      if(wave<8 && timeLeft<totalTime()-wave*(totalTime()/9)){
        wave++; SFX.wave(); confetti(20); doFlash('#ffd43b',0.26);
        popAt(W/2,gy*0.38,'ĐỢT '+wave,'#ff922b',30);
      }
      // sinh muc tieu thuong: LUON spawn, ke ca khi dang co boss
      spawnT-=raw;
      var want=wantCount();
      if(spawnT<=0 && targets.filter(function(t){return !t.boss;}).length<want){
        spawnOne();
        spawnT=Math.max(0.06,0.22-wave*0.015);
      }
      // boss: den lich thi xuat hien, neu khong ha duoc thi bay di
      if(!bossAlive && bossNext>0){
        bossNext-=raw;
        if(bossNext<=0){
          targets.push(makeBoss(wave)); bossAlive=true; SFX.boss(); doShake(8);
          popAt(W/2,gy*0.30,'BOSS XUẤT HIỆN!','#b197fc',28);
        }
      }
      autoTap(raw);
      var i,a,bb;
      for(i=targets.length-1;i>=0;i--){
        var tg=targets[i];
        tg.y+=tg.vy*dt; tg.x+=tg.vx*dt;
        if(tg.boss){
          tg.x+=tg.dir*(34+wave*2)*dt;
          if(tg.x<tg.r*1.4||tg.x>W-tg.r*1.4) tg.dir*=-1;
          // boss khong ha duoc: bay ra khoi man hinh, khong mat mang
          if(tg.y>groundY()-tg.r*0.2){
            targets.splice(i,1); bossAlive=false; bossNext=Math.max(14,24-wave*1.5);
            burst(tg.x,gy-10,'#b197fc',18,7); SFX.miss(); doShake(6);
            popAt(tg.x,gy-40,'BOSS BỎ ĐI!','#868e96',20);
          }
        } else {
          if(tg.x<tg.r+6||tg.x>W-tg.r-6){ tg.vx*=-1; tg.x=clamp(tg.x,tg.r+6,W-tg.r-6); }
          if(tg.y>groundY()-tg.r*0.4){
            targets.splice(i,1); lives-=missCost(); combo=0;
            burst(tg.x,groundY()-6,'#ff6b6b',10,5);
            SFX.miss(); doShake(7); doFlash('#ff6b6b',0.22);
            popAt(tg.x,groundY()-30,'SÓT!','#ff6b6b',20);
            if(lives<=0){ lives=0; endRound(); break; }
          }
        }
      }
      for(a=0;a<targets.length;a++) for(bb=a+1;bb<targets.length;bb++){
        var t1=targets[a],t2=targets[bb];
        if(t1.boss||t2.boss) continue;
        var ddx=t2.x-t1.x,ddy=t2.y-t1.y;
        var dd=Math.sqrt(ddx*ddx+ddy*ddy)||0.001, mnd=t1.r+t2.r+14;
        if(dd<mnd){ var pu=(mnd-dd)*0.5, ux=ddx/dd,uy=ddy/dd;
          t1.x-=ux*pu; t2.x+=ux*pu; t1.y-=uy*pu*0.4; t2.y+=uy*pu*0.4;
          // giu trong khung sau khi day nhau
          t1.x=clamp(t1.x,t1.r+6,W-t1.r-6); t2.x=clamp(t2.x,t2.r+6,W-t2.r-6);
        }
      }
      for(i=0;i<targets.length;i++){
        var tk=targets[i];
        if(tk.y>groundY()) continue;
        // mo dan khi lui vao tu tren, tranh hinh bi cat cut o mep
        if(tk.y<PLAY_TOP-6){
          var al=clamp((tk.y-(PLAY_TOP-tk.r-6))/tk.r,0,1);
          if(al<=0.02) continue;
          drawTarget(tk,now,al);
        } else drawTarget(tk,now,1);
      }
      drawHud();
    }
  }
  else if(st===ST_OVER) drawGameOver();
  else if(st===ST_PICK) drawPick();
  else if(st===ST_SHOP) drawShop();
  else if(st===ST_STATS) drawStats();

  for(var b2=bits.length-1;b2>=0;b2--){
    var p=bits[b2]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=13*dt; p.rot+=p.vr*dt; p.life-=raw*1.5;
    if(p.life<=0){ bits.splice(b2,1); continue; }
    g.save(); g.globalAlpha=Math.max(0,p.life); g.translate(p.x,p.y); g.rotate(p.rot);
    g.fillStyle=p.col; rr(-p.r/2,-p.r/2,p.r,p.r,p.r*0.3); g.fill(); g.restore();
  }
  for(var r2=rings.length-1;r2>=0;r2--){
    var rg=rings[r2]; rg.life-=raw*2.6;
    if(rg.life<=0){ rings.splice(r2,1); continue; }
    var rr3=rg.r0+(rg.r1-rg.r0)*(1-rg.life);
    g.save(); g.globalAlpha=rg.life*0.7; g.strokeStyle=rg.col; g.lineWidth=Math.max(1,6*rg.life);
    g.beginPath(); g.arc(rg.x,rg.y,rr3,0,6.2832); g.stroke(); g.restore();
  }
  for(var p2=pops.length-1;p2>=0;p2--){
    var q=pops[p2]; q.y-=52*dt; q.life-=raw*2.0;
    if(q.life<=0){ pops.splice(p2,1); continue; }
    txt(q.t,q.x,q.y,q.size,q.col,'center','bold','rgba(255,255,255,.9)');
  }
  for(var c2=conf.length-1;c2>=0;c2--){
    var k2=conf[c2]; k2.x+=k2.vx*dt; k2.y+=k2.vy*dt; k2.rot+=k2.vr*dt; k2.life-=raw*0.5;
    if(k2.y>H+30){ conf.splice(c2,1); continue; }
    g.save(); g.globalAlpha=clamp(k2.life,0,1); g.translate(k2.x,k2.y); g.rotate(k2.rot);
    g.fillStyle=k2.col; g.fillRect(-k2.w/2,-k2.h/2,k2.w,k2.h); g.restore();
  }
  // vignette
  if(curMap.dark>0){
    g.save();
    var vg=g.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.25,W/2,H*0.5,Math.max(W,H)*0.78);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,'+curMap.dark+')');
    g.fillStyle=vg; g.fillRect(-30,-30,W+60,H+60); g.restore();
  }
  g.restore();
  if(shake>0.2) shake*=0.86;
  if(flash>0.01){ g.save(); g.globalAlpha=flash*0.5; g.fillStyle=flashCol; g.fillRect(0,0,W,H); g.restore(); flash*=0.90; }
  requestAnimationFrame(loop);
}

function onDown(x,y){
  if(st===ST_MENU){
    var b=btnRect();
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){ startRound(); return; }
    var y2=b.y+b.h+18, bw2=(b.w-14)/2;
    if(y>y2&&y<y2+54){
      if(x<b.x+bw2){ prevSt=ST_MENU; goto(ST_SHOP); scrollY=0; }
      else goto(ST_PICK);
      return;
    }
    if(y>H-80&&y<H-34){ S.muted=!S.muted; save(); }
    return;
  }
  if(st===ST_PLAY){ tap(x,y); return; }
  if(st===ST_OVER){
    var pw=Math.min(360,W*0.88), ph=Math.min(330,H*0.82), px=(W-pw)/2, py=(H-ph)/2;
    var by=py+ph-112, bh=48, bw=(pw-46)/2;
    if(y>by&&y<by+bh){
      if(x<px+18+bw) startRound();
      else { prevSt=ST_OVER; goto(ST_SHOP); scrollY=0; }
      return;
    }
    goto(ST_MENU); return;
  }
  if(st===ST_PICK){
    var mw=Math.min(280,W*0.66), my=H*0.64;
    if(y>my&&y<my+56){
      var m2=MAPS[pickIdx];
      if(S.maps.indexOf(m2.id)>=0){ S.map=m2.id; startRound(); }
      else if(S.coins>=m2.cost){ S.coins-=m2.cost; S.maps.push(m2.id); S.map=m2.id; save(); SFX.buy(); startRound(); }
      else SFX.deny();
      return;
    }
    if(y>my+94&&y<my+140){ goto(ST_MENU); return; }
    if(y<100){ pickIdx=(pickIdx+(x<W/2?-1:1)+MAPS.length)%MAPS.length; SFX.coin(); }
    return;
  }
  if(st===ST_SHOP){
    var ty=62, th=42, tw=Math.min(190,W*0.44), t0=(W-(tw*2+10))/2;
    if(y>ty&&y<ty+th){ var nw=(x>t0+tw+5)?1:0; if(nw!==shopTab){ shopTab=nw; scrollY=0; SFX.coin(); } return; }
    if(y>H-70&&y<H-12){ goto(prevSt||ST_MENU); prevSt=ST_MENU; return; }
    var list=shopTab===0?UPS:CATS, top=ty+th+12, rowH=Math.min(74,H*0.13), i;
    for(i=0;i<list.length;i++){
      var ry=top+i*rowH-scrollY;
      if(y<ry||y>ry+rowH-10) continue;
      var it=list[i], isUp=shopTab===0;
      if(!isUp&&owned(it.id)) continue;
      var lv=isUp?upLv(it.id):0, cost=isUp?upCost(it.id):it.cost;
      if(isUp&&lv>=it.max) continue;
      if(S.coins>=cost){
        S.coins-=cost; SFX.buy();
        if(isUp) S.ups[it.id]=lv+1; else S.cats.push(it.id);
        save();
      } else SFX.deny();
      return;
    }
    return;
  }
  if(st===ST_STATS){ if(y>H-72&&y<H-8) goto(ST_MENU); }
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); onDown(e.clientX,e.clientY); },{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='KeyM'){ S.muted=!S.muted; save(); return; }
  if(st===ST_PICK){
    if(e.code==='ArrowLeft'){ pickIdx=(pickIdx-1+MAPS.length)%MAPS.length; return; }
    if(e.code==='ArrowRight'){ pickIdx=(pickIdx+1)%MAPS.length; return; }
  }
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(st===ST_PLAY){
      var vis=targets.filter(function(t){ return t.y>PLAY_TOP; });
      if(vis.length){ var tt=vis[Math.floor(Math.random()*vis.length)]; tap(tt.x,tt.y); }
    }
    else if(st===ST_MENU||st===ST_OVER) startRound();
  }
});
cv.addEventListener('wheel',function(e){ if(st===ST_SHOP) scrollY+=e.deltaY; },{passive:true});
window.addEventListener('resize',function(){ buildRidge(W); });

/* =================== OFFLINE =================== */
function offlineCheck(){
  var now=Date.now(), mins=(now-(S.lastSeen||now))/60000;
  S.lastSeen=now;
  if(mins>5){
    var rate=(1+upLv('coin')*0.12)*bonus().coin;
    var gain=Math.floor(Math.min(mins/60*rate*45,500+rate*200));
    if(gain>0){ S.coins+=gain;
      setTimeout(function(){ popAt(W/2,H*0.45,'+'+money(gain)+' xu khi bạn vắng mặt!','#ff922b',20); },600); }
  }
  save();
}
setInterval(function(){ S.lastSeen=Date.now(); save(); },20000);

/* =================== SDK =================== */
var poki=(function(){ try{ return new PokiSDK(); }catch(e){ return null; } })();
var crazy=(function(){ try{ return window.CrazyGames&&window.CrazyGames.SDK?new CrazyGames.SDK():null; }catch(e){ return null; } })();
function each(fn){ try{ if(poki) fn(poki); }catch(e){} try{ if(crazy) fn(crazy); }catch(e){} }
each(function(s){ if(s.loadingStart) s.loadingStart(); });
function happy(){ each(function(s){ if(s.happyTime) s.happyTime(); }); }
function gameOverSDK(sc){ each(function(s){ if(s.gameOver) s.gameOver({score:sc,best:S.best}); }); }
each(function(s){ if(s.gameplayPause) s.gameplayPause(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) pauseAll(); });
function pauseAll(){
  each(function(s){ if(s.gameplayPause) s.gameplayPause(); });
  if(st===ST_PLAY){ clearFx(); st=ST_OVER; timeLeft=0; }
  S.lastSeen=Date.now(); save();
}

/* =================== KHỞI ĐỘNG =================== */
load(); offlineCheck();
if(S.maps.indexOf(S.map)<0) S.map='garden';
curMap=MAP(S.map); buildRidge(W);
requestAnimationFrame(loop);
setTimeout(function(){ each(function(s){ if(s.loadingFinished) s.loadingFinished(); }); },250);
</script>
